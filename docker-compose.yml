services:
  db:
    image: pgvector/pgvector:pg16
    container_name: newslens-db
    ports:
      - "5433:5432"
    env_file:
      - ./agent/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent:
    build: ./agent
    container_name: newslens-agent
    ports:
      - "8000:8000"
    env_file:
      - ./agent/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: newslens-frontend
    ports:
      - "5173:5173"
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  postgres_data:
